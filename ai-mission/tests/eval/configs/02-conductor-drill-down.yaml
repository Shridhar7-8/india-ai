# ──────────────────────────────────────────────────────────────────────────────
# Suite 02 — Conductor Drill-Down Behaviour
# Tests that vague answers on steps with maxDrills > 0 keep the FSM on the same
# step (nextStepIndex === stepIndex, nextDrillCount === drillCount + 1).
# Also tests force-advance: a vague answer at drillCount=maxDrills MUST advance.
# ──────────────────────────────────────────────────────────────────────────────

# ── Step 3: life_goals (maxDrills=2) ──────────────────────────────────────────

- description: "Step 3 life_goals: vague single-timeframe answer triggers drill-down"
  vars:
    userMessage: "I want to grow my startup and be successful."
    stepIndex: 3
    drillCount: 0
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.nextStepIndex === 3 && out.nextDrillCount === 1;

- description: "Step 3 life_goals: still vague at drillCount=1 triggers second drill"
  vars:
    userMessage: "I want to scale the company internationally in the long run."
    stepIndex: 3
    drillCount: 1
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.nextStepIndex === 3 && out.nextDrillCount === 2;

- description: "Step 3 life_goals: vague answer at max drills (2) force-advances to step 4"
  vars:
    userMessage: "I just want to make an impact somehow."
    stepIndex: 3
    drillCount: 2
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.nextStepIndex === 4;

# ── Step 4: startup_vs_technology (maxDrills=2) ───────────────────────────────

- description: "Step 4 startup_vs_technology: generic answer without business specifics triggers drill"
  vars:
    userMessage: "A startup is more than just technology. Business is important too."
    stepIndex: 4
    drillCount: 0
  assert:
    - type: is-json
    - type: javascript
      value: "const out = JSON.parse(output); out.nextStepIndex === 4;"

- description: "Step 4 startup_vs_technology: vague at max drills force-advances"
  vars:
    userMessage: "Business means making money, not just building stuff."
    stepIndex: 4
    drillCount: 2
  assert:
    - type: is-json
    - type: javascript
      value: "const out = JSON.parse(output); out.nextStepIndex === 5;"

