# ── EVASION: deflecting or changing the subject ───────────────────────────────

- description: "Red flag EVASION: changing subject when asked about revenue model"
  vars:
    userMessage: "Revenue is a complex topic. What I really want to focus on is the product vision and how transformative it will be for users. The market will figure it out."
    currentTopic: "zone_2_viability"
    history:
      - role: "assistant"
        content: "What is your business model and how will you generate revenue?"
      - role: "user"
        content: "Revenue is a complex topic. What I really want to focus on is the product vision and how transformative it will be for users. The market will figure it out."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.redFlags.length > 0 && out.redFlags.some(f => ['EVASION', 'VAGUE_FLUFF'].includes(f.category));

- description: "Red flag EVASION: repeated vagueness after explicit follow-up about moat"
  vars:
    userMessage: "We have competitive advantages. I would rather not get into specifics right now. Trust me, we have thought about this."
    currentTopic: "zone_4_defensibility"
    history:
      - role: "assistant"
        content: "Can you be more specific about what makes your solution hard to replicate?"
      - role: "user"
        content: "We have competitive advantages. I would rather not get into specifics right now. Trust me, we have thought about this."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.redFlags.length > 0 && out.redFlags.some(f => ['EVASION', 'CLARITY_GAP'].includes(f.category));

