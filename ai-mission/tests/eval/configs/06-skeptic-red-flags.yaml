# ──────────────────────────────────────────────────────────────────────────────
# Suite 06 — Skeptic Red Flag Detection
# Two tests per red flag category (clear trigger + borderline).
# Each test includes the userMessage in the history array so the evidence
# validator in skeptic.ts can find verbatim quotes.
# ──────────────────────────────────────────────────────────────────────────────

# ── LOGIC_GAP: contradicts previous statements ───────────────────────────────

- description: "Red flag LOGIC_GAP: claims 10M users but just launched last week"
  vars:
    userMessage: "We already have 10 million active users and 100 crore in revenue per month. We launched just last week."
    currentTopic: "zone_2_viability"
    history:
      - role: "user"
        content: "We already have 10 million active users and 100 crore in revenue per month. We launched just last week."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.redFlags.length > 0 && out.redFlags.some(f => f.category === 'LOGIC_GAP');
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const flag = out.redFlags.find(f => f.category === 'LOGIC_GAP');
        return flag && Array.isArray(flag._evidence) && flag._evidence.length > 0;

- description: "Red flag LOGIC_GAP: says solo founder then says 'we have a team of 10'"
  vars:
    userMessage: "Yes I am a solo founder, just me. Our team of 10 engineers is making great progress on the backend."
    currentTopic: "founder_status"
    history:
      - role: "user"
        content: "Yes I am a solo founder, just me. Our team of 10 engineers is making great progress on the backend."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.redFlags.length > 0 && out.redFlags.some(f => f.category === 'LOGIC_GAP');

