    userMessage: "My first startup failed because we were losing 80 rupees per order on food delivery and did not realise it until month 4. I had to shut it down after burning 6 lakh rupees of my own savings. The concrete lesson: I now model unit economics before writing a single line of code. That is why FutureMind's unit economics were validated before we built anything."
