# ──────────────────────────────────────────────────────────────────────────────
# Suite 07 — Skeptic Green Flag Detection
# One test per green flag category (9 total).
# Each test includes the userMessage in history so evidence validator passes.
# ──────────────────────────────────────────────────────────────────────────────

# Problem Clarity
- description: "Green flag Problem Clarity: sharp specific pain point articulation"
  vars:
    userMessage: "Class 10-12 students in tier-2 cities cannot afford private tutors at 500-1000 rupees per hour. 80% of students I interviewed said they had never had a private tutor because of cost. This directly causes 30% lower exam scores compared to urban students who can afford tutoring."
    currentTopic: "startup_idea"
    history:
      - role: "user"
        content: "Class 10-12 students in tier-2 cities cannot afford private tutors at 500-1000 rupees per hour. 80% of students I interviewed said they had never had a private tutor because of cost. This directly causes 30% lower exam scores compared to urban students who can afford tutoring."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.greenFlags.length > 0 && out.greenFlags.some(f => f.category === 'Problem Clarity');

# Commercial Awareness
- description: "Green flag Commercial Awareness: distinguishes user from customer unprompted"
  vars:
    userMessage: "The student is the user but the parent is the customer — they are the ones paying. So our product must delight the student enough to keep them engaged while proving ROI to the parent. That is why we send weekly progress reports to parents automatically."
    currentTopic: "zone_1_desirability"
    history:
      - role: "user"
        content: "The student is the user but the parent is the customer — they are the ones paying. So our product must delight the student enough to keep them engaged while proving ROI to the parent. That is why we send weekly progress reports to parents automatically."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        return out.greenFlags.length > 0 && out.greenFlags.some(f => f.category === 'Commercial Awareness');

# Ecosystem Thinking
- description: "Green flag Ecosystem Thinking: thinks beyond own product to India AI ecosystem"
  vars:
    userMessage: "Beyond our own product, we plan to open-source our Hindi NLP evaluation benchmark — it does not exist today and the whole Indian AI community needs it. We are also generating 100,000 student interactions daily in Hindi which we will contribute to public datasets to help train better Indian language models."
    currentTopic: "ai_ecosystem_contribution"
    history:
      - role: "user"
        content: "Beyond our own product, we plan to open-source our Hindi NLP evaluation benchmark — it does not exist today and the whole Indian AI community needs it. We are also generating 100,000 student interactions daily in Hindi which we will contribute to public datasets to help train better Indian language models."
  assert:
    - type: is-json
    - type: javascript
      value: |
        const out = JSON.parse(output);
        const norm = s => s.toLowerCase().replace(/[\s_]/g, '');
        return out.greenFlags.length > 0 && out.greenFlags.some(f => norm(f.category) === norm('Ecosystem Thinking'));

