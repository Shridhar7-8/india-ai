# AI Conviction
- description: "Green flag AI Conviction: clearly articulates structural AI necessity"
  vars:
    userMessage: "Without AI, personalized tutoring at this scale requires one human tutor per student — economically impossible. AI is what enables us to analyze each student's exact knowledge gaps in real time and generate custom practice questions dynamically. Remove AI and you just have a static PDF library. AI is not a feature, it is the entire product."
