name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Lint, Build, and Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Add build-time env vars if necessary

      - name: Run Unit & Integration Tests
        run: npm run test
        
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test-and-build
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      # We need to build the app again here for Playwright to serve, or cache it from previous job.
      - name: Build Application for E2E
        run: npm run build
        
      - name: Run Playwright Tests
        run: npx playwright test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-and-build, e2e-tests]
    # Only run deploy on push to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          port: ${{ secrets.SERVER_PORT }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e
            
            # Application Directory
            APP_DIR="/var/www/india-ai/india-ai/ai-mission"
            
            # Check if directory exists, if not, clone it
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory does not exist. Please clone the repository manually the first time."
              exit 1
            fi
            
            cd $APP_DIR
            
            # Pull latest changes
            git pull origin main
            
            # Clean install dependencies
            npm ci
            
            # Build for production
            npm run build
            
            # Restart or start PM2 process
            # We assume the PM2 process is named "india-ai-prod"
            pm2 restart india-ai-prod || pm2 start npm --name "india-ai-prod" -- start
            
            echo "Deployment successful!"
