name: CI / CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    name: Lint, Build, and Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai-mission
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ai-mission/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run Unit & Integration Tests
        run: npm run test
        
  e2e-tests:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: test-and-build
    defaults:
      run:
        working-directory: ./ai-mission
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './ai-mission/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      
      - name: Build Application for E2E
        run: npm run build
        
      - name: Run Playwright Tests
        run: npx playwright test

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-and-build, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            
            # Application Directory
            APP_DIR="/var/www/buildai/ai-mission"
            
            if [ ! -d "$APP_DIR" ]; then
              echo "Directory does not exist. Please clone the repository manually the first time."
              exit 1
            fi
            
            # Go back to the repo root
            cd /var/www/buildai
            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            
            # Go back to the app directory
            cd $APP_DIR

            npm ci
            npm run build

            pm2 restart buildai --update-env || pm2 start npm --name "buildai" -- start
            echo "Deployment successful!"
